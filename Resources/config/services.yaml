services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  OpenDemat\AdminBundle\:
    resource: '../../src/*'
    exclude: '../../src/{DependencyInjection,AdminBundle.php}'

  OpenDemat\AdminBundle\Twig\AdminOrganizationExtension:
    arguments:
      $organizationName: '%open_demat_admin.organization.name%'
      $organizationLogo: '%open_demat_admin.organization.logo%'
      $themePrimaryColor: '%open_demat_admin.theme.primary_color%'
      $themePrimaryDarkColor: '%open_demat_admin.theme.primary_dark_color%'
    tags: ['twig.extension']

  OpenDemat\AdminBundle\Service\AdminGlobalConfiguration:
    arguments:
      $organization:
        name: '%open_demat_admin.organization.name%'
        logo: '%open_demat_admin.organization.logo%'
      $theme:
        primary_color: '%open_demat_admin.theme.primary_color%'
        primary_dark_color: '%open_demat_admin.theme.primary_dark_color%'
      $cas:
        base_url: '%open_demat_admin.cas.base_url%'
        logout_url: '%open_demat_admin.cas.logout_url%'
        host: '%open_demat_admin.cas.host%'
        port: '%open_demat_admin.cas.port%'
        path: '%open_demat_admin.cas.path%'
        login_target: '%open_demat_admin.cas.login_target%'
        gateway: '%open_demat_admin.cas.gateway%'
      $saml2:
        enabled: '%open_demat_admin.saml2.enabled%'
        identifier_attribute: '%open_demat_admin.saml2.identifier_attribute%'
        email_attribute: '%open_demat_admin.saml2.email_attribute%'
        first_name_attribute: '%open_demat_admin.saml2.first_name_attribute%'
        last_name_attribute: '%open_demat_admin.saml2.last_name_attribute%'
        default_email_domain: '%open_demat_admin.saml2.default_email_domain%'
        auto_create_user: '%open_demat_admin.saml2.auto_create_user%'
        login_url: '%open_demat_admin.saml2.login_url%'
      $s3:
        endpoint: '%open_demat_admin.s3.endpoint%'
        region: '%open_demat_admin.s3.region%'
        bucket: '%open_demat_admin.s3.bucket%'
        use_path_style: '%open_demat_admin.s3.use_path_style%'
        access_key: '%open_demat_admin.s3.access_key%'
        secret_key: '%open_demat_admin.s3.secret_key%'

  OpenDemat\AdminBundle\Service\AdminGlobalConfigurationWriter:
    arguments:
      $projectDir: '%kernel.project_dir%'

  OpenDemat\AdminBundle\Hub\AdminGlobalAppDefinition:
    tags: ['open_demat.hub.app_definition']
