services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  OpenDemat\AdminBundle\:
    resource: '../../src/*'
    exclude: '../../src/{DependencyInjection,AdminBundle.php}'

  OpenDemat\AdminBundle\Twig\AdminOrganizationExtension:
    arguments:
      $organizationName: '%open_demat_admin.organization.name%'
      $organizationLogo: '%open_demat_admin.organization.logo%'
      $themePrimaryColor: '%open_demat_admin.theme.primary_color%'
      $themePrimaryDarkColor: '%open_demat_admin.theme.primary_dark_color%'
    tags: ['twig.extension']

  OpenDemat\AdminBundle\Service\AdminGlobalConfiguration:
    arguments:
      $organization:
        name: '%open_demat_admin.organization.name%'
        logo: '%open_demat_admin.organization.logo%'
      $theme:
        primary_color: '%open_demat_admin.theme.primary_color%'
        primary_dark_color: '%open_demat_admin.theme.primary_dark_color%'
      $local:
        admin_username: '%open_demat_admin.local.admin_username%'
        admin_password: '%open_demat_admin.local.admin_password%'
      $cas:
        enabled: '%open_demat_admin.cas.enabled%'
        base_url: '%open_demat_admin.cas.base_url%'
        logout_url: '%open_demat_admin.cas.logout_url%'
        host: '%open_demat_admin.cas.host%'
        port: '%open_demat_admin.cas.port%'
        path: '%open_demat_admin.cas.path%'
        login_target: '%open_demat_admin.cas.login_target%'
        gateway: '%open_demat_admin.cas.gateway%'
      $ldap:
        enabled: '%open_demat_admin.ldap.enabled%'
        connection_string: '%open_demat_admin.ldap.connection_string%'
        base_dn: '%open_demat_admin.ldap.base_dn%'
        search_filter: '%open_demat_admin.ldap.search_filter%'
        bind_dn: '%open_demat_admin.ldap.bind_dn%'
        bind_password: '%open_demat_admin.ldap.bind_password%'
        identifier_attribute: '%open_demat_admin.ldap.identifier_attribute%'
        email_attribute: '%open_demat_admin.ldap.email_attribute%'
        first_name_attribute: '%open_demat_admin.ldap.first_name_attribute%'
        last_name_attribute: '%open_demat_admin.ldap.last_name_attribute%'
        auto_create_user: '%open_demat_admin.ldap.auto_create_user%'
      $saml2:
        enabled: '%open_demat_admin.saml2.enabled%'
        strict: '%open_demat_admin.saml2.strict%'
        debug: '%open_demat_admin.saml2.debug%'
        sp_entity_id: '%open_demat_admin.saml2.sp_entity_id%'
        sp_acs_url: '%open_demat_admin.saml2.sp_acs_url%'
        sp_sls_url: '%open_demat_admin.saml2.sp_sls_url%'
        sp_name_id_format: '%open_demat_admin.saml2.sp_name_id_format%'
        sp_x509_cert: '%open_demat_admin.saml2.sp_x509_cert%'
        sp_private_key: '%open_demat_admin.saml2.sp_private_key%'
        idp_metadata_file: '%open_demat_admin.saml2.idp_metadata_file%'
        idp_metadata_url: '%open_demat_admin.saml2.idp_metadata_url%'
        idp_metadata_xml: '%open_demat_admin.saml2.idp_metadata_xml%'
        idp_entity_id: '%open_demat_admin.saml2.idp_entity_id%'
        idp_sso_url: '%open_demat_admin.saml2.idp_sso_url%'
        idp_slo_url: '%open_demat_admin.saml2.idp_slo_url%'
        idp_x509_cert: '%open_demat_admin.saml2.idp_x509_cert%'
        authn_requests_signed: '%open_demat_admin.saml2.authn_requests_signed%'
        logout_request_signed: '%open_demat_admin.saml2.logout_request_signed%'
        logout_response_signed: '%open_demat_admin.saml2.logout_response_signed%'
        want_messages_signed: '%open_demat_admin.saml2.want_messages_signed%'
        want_assertions_signed: '%open_demat_admin.saml2.want_assertions_signed%'
        want_assertions_encrypted: '%open_demat_admin.saml2.want_assertions_encrypted%'
        want_name_id_encrypted: '%open_demat_admin.saml2.want_name_id_encrypted%'
        sign_metadata: '%open_demat_admin.saml2.sign_metadata%'
        identifier_attribute: '%open_demat_admin.saml2.identifier_attribute%'
        email_attribute: '%open_demat_admin.saml2.email_attribute%'
        first_name_attribute: '%open_demat_admin.saml2.first_name_attribute%'
        last_name_attribute: '%open_demat_admin.saml2.last_name_attribute%'
        auto_create_user: '%open_demat_admin.saml2.auto_create_user%'
      $s3:
        endpoint: '%open_demat_admin.s3.endpoint%'
        region: '%open_demat_admin.s3.region%'
        bucket: '%open_demat_admin.s3.bucket%'
        use_path_style: '%open_demat_admin.s3.use_path_style%'
        access_key: '%open_demat_admin.s3.access_key%'
        secret_key: '%open_demat_admin.s3.secret_key%'

  OpenDemat\AdminBundle\Service\AdminGlobalConfigurationWriter:
    arguments:
      $projectDir: '%kernel.project_dir%'

  OpenDemat\AdminBundle\Hub\AdminGlobalAppDefinition:
    tags: ['open_demat.hub.app_definition']
