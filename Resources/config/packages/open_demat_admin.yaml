open_demat_admin:
  organization:
    name: '%env(default::ORGANIZATION_NAME)%'
    logo: '%env(default:organization_logo_default:ORGANIZATION_LOGO)%'
  theme:
    primary_color: '%env(default::THEME_PRIMARY_COLOR)%'
    primary_dark_color: '%env(default::THEME_PRIMARY_DARK_COLOR)%'
  local:
    admin_username: '%env(default::LOCAL_ADMIN_USERNAME)%'
    admin_password: '%env(default::LOCAL_ADMIN_PASSWORD)%'
  cas:
    enabled: '%env(default::CAS_ENABLED)%'
    base_url: '%env(default::CAS_BASE_URL)%'
    logout_url: '%env(default::CAS_LOGOUT_URL)%'
    host: '%env(default::CAS_HOST)%'
    port: '%env(default::CAS_PORT)%'
    path: '%env(default::CAS_PATH)%'
    login_target: '%env(default::CAS_LOGIN_TARGET)%'
    gateway: '%env(default::CAS_GATEWAY)%'
  ldap:
    enabled: '%env(default::LDAP_ENABLED)%'
    connection_string: '%env(default::LDAP_CONNECTION_STRING)%'
    base_dn: '%env(default::LDAP_BASE_DN)%'
    search_filter: '%env(default::LDAP_SEARCH_FILTER)%'
    bind_dn: '%env(default::LDAP_BIND_DN)%'
    bind_password: '%env(default::LDAP_BIND_PASSWORD)%'
    identifier_attribute: '%env(default::LDAP_IDENTIFIER_ATTRIBUTE)%'
    email_attribute: '%env(default::LDAP_EMAIL_ATTRIBUTE)%'
    first_name_attribute: '%env(default::LDAP_FIRST_NAME_ATTRIBUTE)%'
    last_name_attribute: '%env(default::LDAP_LAST_NAME_ATTRIBUTE)%'
    auto_create_user: '%env(default::LDAP_AUTO_CREATE_USER)%'
  saml2:
    enabled: '%env(default::SAML2_ENABLED)%'
    strict: '%env(default::SAML2_STRICT)%'
    debug: '%env(default::SAML2_DEBUG)%'
    sp_entity_id: '%env(default::SAML2_SP_ENTITY_ID)%'
    sp_acs_url: '%env(default::SAML2_SP_ACS_URL)%'
    sp_sls_url: '%env(default::SAML2_SP_SLS_URL)%'
    sp_name_id_format: '%env(default::SAML2_SP_NAME_ID_FORMAT)%'
    sp_x509_cert: '%env(default::SAML2_SP_X509_CERT)%'
    sp_private_key: '%env(default::SAML2_SP_PRIVATE_KEY)%'
    idp_metadata_file: '%env(default::SAML2_IDP_METADATA_FILE)%'
    idp_metadata_url: '%env(default::SAML2_IDP_METADATA_URL)%'
    idp_metadata_xml: '%env(default::SAML2_IDP_METADATA_XML)%'
    idp_entity_id: '%env(default::SAML2_IDP_ENTITY_ID)%'
    idp_sso_url: '%env(default::SAML2_IDP_SSO_URL)%'
    idp_slo_url: '%env(default::SAML2_IDP_SLO_URL)%'
    idp_x509_cert: '%env(default::SAML2_IDP_X509_CERT)%'
    authn_requests_signed: '%env(default::SAML2_AUTHN_REQUESTS_SIGNED)%'
    logout_request_signed: '%env(default::SAML2_LOGOUT_REQUEST_SIGNED)%'
    logout_response_signed: '%env(default::SAML2_LOGOUT_RESPONSE_SIGNED)%'
    want_messages_signed: '%env(default::SAML2_WANT_MESSAGES_SIGNED)%'
    want_assertions_signed: '%env(default::SAML2_WANT_ASSERTIONS_SIGNED)%'
    want_assertions_encrypted: '%env(default::SAML2_WANT_ASSERTIONS_ENCRYPTED)%'
    want_name_id_encrypted: '%env(default::SAML2_WANT_NAME_ID_ENCRYPTED)%'
    sign_metadata: '%env(default::SAML2_SIGN_METADATA)%'
    identifier_attribute: '%env(default::SAML2_IDENTIFIER_ATTRIBUTE)%'
    email_attribute: '%env(default::SAML2_EMAIL_ATTRIBUTE)%'
    first_name_attribute: '%env(default::SAML2_FIRST_NAME_ATTRIBUTE)%'
    last_name_attribute: '%env(default::SAML2_LAST_NAME_ATTRIBUTE)%'
    auto_create_user: '%env(default::SAML2_AUTO_CREATE_USER)%'
  s3:
    endpoint: '%env(default::S3_ENDPOINT)%'
    region: '%env(default::S3_REGION)%'
    bucket: '%env(default::S3_BUCKET)%'
    use_path_style: '%env(default::S3_USE_PATH_STYLE)%'
    access_key: '%env(default::S3_ACCESS_KEY)%'
    secret_key: '%env(default::S3_SECRET_KEY)%'
